{% extends 'base.html' %}

{% block content %}
<div x-data="{ activeTab: 'upload' }" class="workspace-container">
    
    <!-- TAB NAVIGATION BAR -->
    <div class="tabs-header">
        <button 
            class="tab-btn" 
            :class="{ 'active': activeTab === 'upload' }" 
            @click="activeTab = 'upload'">
            Upload
        </button>
        <button 
            class="tab-btn" 
            :class="{ 'active': activeTab === 'explore' }" 
            @click="activeTab = 'explore'"
            hx-get="{% url 'project1:explore_view' %}" 
            hx-target="#explore-tab-content">
            Exploration
        </button>
        <button 
            class="tab-btn" 
            :class="{ 'active': activeTab === 'train' }" 
            @click="activeTab = 'train'"
            hx-get="{% url 'project1:train_view' %}" 
            hx-target="#train-tab-content">
            Training
        </button>
    </div>

    <!-- TAB BODIES -->
    <div class="tab-bodies">
        <!-- 1. Upload Tab -->
        <div x-show="activeTab === 'upload'">
            {% include 'project1/partials/upload_partial.html' %}
        </div>

        <!-- 2. Exploration Tab -->
        <div x-show="activeTab === 'explore'" id="explore-tab-content">
            <p>Select a dataset to begin exploration.</p>
        </div>

        <!-- 3. Training Tab -->
        <div x-show="activeTab === 'train'" id="train-tab-content">
            <p>Configure model parameters after dataset upload.</p>
        </div>
    </div>

</div>
{% endblock %}
